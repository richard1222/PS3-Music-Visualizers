<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saber Anime Music Visuals</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030819;color:white;font-family:Arial,sans-serif}
#art{position:absolute;left:0;top:0;width:100%;height:100%;background:#030819 center center no-repeat;background-size:cover}
#effects{position:absolute;left:0;top:0;width:100%;height:100%}
#controls{position:absolute;left:3%;top:5%;padding:16px;background:rgba(0,0,0,.7);border:1px solid #709ccb;max-width:600px}
h1{font-size:24px;margin:0 0 10px}p{font-size:16px;line-height:1.5;margin:8px 0}button{padding:10px;margin:4px;border:1px solid #709ccb;background:#132b4f;color:#fff;font-size:17px}
#hint{position:absolute;bottom:15px;left:20px;font-size:13px;color:#d6e8ff}
</style></head><body>
<div id="art"></div><canvas id="effects"></canvas>
<div id="controls"><h1>Saber Anime Music Visuals</h1>
<p>Start music in the PS3 XMB, then open this viewer. The artwork has timed animation; this viewer does not read or analyze XMB audio.</p>
<button onclick="choose(0)">Moonlit city</button><button onclick="choose(1)">Cosmic night</button><button onclick="choose(2)">Piano night</button>
<button onclick="toggleMotion()">Motion on / off</button><button onclick="hideControls()">Hide controls</button>
<p id="status">Loading artwork...</p></div><div id="hint">Enter: controls &nbsp; Left / Right: artwork &nbsp; Space: motion</div>
<script src="visualizer.js"></script>
</body></html>
